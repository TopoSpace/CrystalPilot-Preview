[project]
name = "crystalpilot"
version = "0.1.0"
description = "Agent-driven single-crystal X-ray structure solution and refinement workbench"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "TopoSpace" }]
requires-python = ">=3.11"
keywords = [
    "crystallography",
    "single-crystal",
    "x-ray-diffraction",
    "structure-refinement",
    "shelx",
    "cctbx",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "gemmi>=0.7",
    "cctbx-base>=2025.9",
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
server = ["fastapi", "uvicorn[standard]", "websockets"]
# Codex app-server harness. The SDK is pinned: the adapter surface is narrow
# and each kernel version is probed before the pin moves.
workbench = ["openai-codex==0.147.0", "psutil>=5.9", "python-docx", "pypdf"]
# Refinement workbench: MCP typed-tool server and ligand chemistry.
# mcp is pinned below 2: the 2.x SDK dropped the low-level explicit-inputSchema
# tool API that the ToolRegistry bridge requires.
refine = ["mcp>=1.2,<2", "rdkit>=2024.3.3"]
dev = ["pytest", "ruff"]

[project.scripts]
crystalpilot = "crystalpilot.cli:main"

[project.urls]
Repository = "https://github.com/TopoSpace/CrystalPilot-Preview"
Issues = "https://github.com/TopoSpace/CrystalPilot-Preview/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crystalpilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Structure-project tests must run outside the source repository.
addopts = "--basetemp=../.crystalpilot-pytest"
markers = [
    "slow: needs an external binary (PLATON) or minutes of CPU; deselect with -m 'not slow'",
]
